name: golang-pipeline

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      -
        name: Check generated logcopter example files
        run: go run ./cmd/logcopter-gen -area-prefix lib.ble -strip-prefix github.com/go-go-golems/logcopter/examples/library-prefix -check ./examples/library-prefix/...
      -
        name: Run unit tests
        run: go test ./...
